<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/local.css">
<style>
  /* xhon design system — light theme tokens */
  :root {
    --color-canvas: #f6f5f3;
    --color-surface: #fdfcfa;
    --color-surface-raised: #ffffff;
    --color-text: #1c1b19;
    --color-text-secondary: #5c5955;
    --color-text-muted: #8a8680;
    --color-text-on-primary: #ffffff;
    --color-border: rgba(28, 27, 25, 0.1);
    --color-divider: rgba(28, 27, 25, 0.08);
    --color-primary: #2d6a6a;
    --color-primary-soft: rgb(229, 239, 239);
    --color-primary-muted: rgba(45, 106, 106, 0.12);
    --color-danger: #b42318;
    --color-table-header-bg-solid: #f5f4f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-canvas); }
  body { font-family: 'Heebo', sans-serif; color: var(--color-text); }
  #bg { position: fixed; inset: 0; background: radial-gradient(ellipse 85% 80% at 50% 45%, #fbfaf8 0%, #f6f5f3 60%, #efeeeb 100%); }

  /* The "camera": everything we film lives inside it */
  #cam { position: fixed; inset: 0; transform-origin: 50% 50%; overflow: hidden; }

  .composer {
    position: absolute; right: 240px; width: 1440px; top: 470px;
    background: var(--color-surface-raised); border-radius: 30px; border: 1.5px solid var(--color-border);
    box-shadow: 0 40px 90px rgba(28, 27, 25, 0.14), 0 8px 24px rgba(28, 27, 25, 0.07);
    padding: 40px 56px 40px 140px; min-height: 140px; transform-origin: 50% 50%; white-space: nowrap;
  }
  .composer .text { font-size: 46px; line-height: 1.35; font-weight: 400; }
  .caret { display: inline-block; width: 3px; height: 50px; background: var(--color-primary); vertical-align: -9px; margin-right: 3px; border-radius: 2px; }
  .send {
    position: absolute; left: 34px; top: 50%; margin-top: -36px; width: 72px; height: 72px; border-radius: 50%;
    background: var(--color-primary); display: flex; align-items: center; justify-content: center;
  }
  .send svg { width: 34px; height: 34px; stroke: var(--color-text-on-primary); stroke-width: 3; fill: none; }
  .ring { position: absolute; left: 34px; top: 50%; margin-top: -36px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--color-primary); opacity: 0; }

  .answer { position: absolute; left: 50%; width: 1560px; margin-left: -780px; top: 285px; }
  .answer .lead { font-size: 34px; margin-bottom: 26px; color: var(--color-text-secondary); }
  .answer .lead b { font-weight: 700; color: var(--color-text); }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0; background: var(--color-surface); border-radius: 26px; overflow: hidden;
    border: 1.5px solid var(--color-border);
    box-shadow: 0 40px 100px rgba(28, 27, 25, 0.12), 0 8px 24px rgba(28, 27, 25, 0.06); font-size: 32px;
  }
  th { background: var(--color-table-header-bg-solid); color: var(--color-text-muted); font-weight: 500; font-size: 24px; text-align: right; padding: 22px 30px; border-bottom: 1.5px solid var(--color-border); }
  td { padding: 22px 30px; border-bottom: 1px solid var(--color-divider); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: left; direction: ltr; }
  td.co { font-weight: 700; }
  td.time { color: var(--color-text-muted); }
  td.neg { color: var(--color-danger); }
  .ref { display: inline-flex; align-items: center; gap: 10px; background: var(--color-primary-muted); color: var(--color-primary); border-radius: 999px; padding: 6px 16px; font-size: 22px; direction: ltr; }
  .ref .n { background: var(--color-primary); color: var(--color-text-on-primary); border-radius: 50%; width: 28px; height: 28px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }

  #whiteout { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="cam">
  <div class="answer" id="answer">
    <div class="lead">היום הוגשו <b>5 דוחות רבעון 3</b> ברשימת המעקב שלך · ₪ מיליונים</div>
    <table>
      <thead><tr>
        <th>חברה</th><th>הוגש</th><th class="num">הכנסות Q3</th><th class="num">שינוי שנתי</th><th class="num">רווח (הפסד) נקי</th><th>מקור</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="composer" id="composer">
    <div class="text" id="text"></div>
    <div class="ring" id="ring"></div>
    <div class="send" id="send"><svg viewBox="0 0 24 24"><path d="M12 19 V5 M5 12 L12 5 L19 12"/></svg></div>
  </div>
</div>
<div id="whiteout"></div>

<script>
const QUERY = 'סכם לי את כל הדוחות שהוגשו היום ברשימת המעקב שלי';

// Real Q3-2025 figures from xhon (ILS millions), filed on the night of 30.11.2025.
const ROWS = [
  { co: "קבוצת חג'ג'",      time: '23:26', rev: '63.7',  yoy: '-44.6%',  net: '25.6',   neg: false, ref: '2025-01-094792' },
  { co: 'רנט איט',          time: '22:40', rev: '17.2',  yoy: '+247.8%', net: '(8.4)',  neg: true,  ref: '2025-01-094784' },
  { co: 'מגוריט ישראל',     time: '22:18', rev: '24.2',  yoy: '-51.7%',  net: '41.9',   neg: false, ref: '2025-01-094772' },
  { co: 'מיטרוניקס',        time: '20:43', rev: '339.1', yoy: '+5.7%',   net: '(40.2)', neg: true,  ref: '2025-01-094745' },
  { co: 'אקויטל',           time: '20:31', rev: '847.8', yoy: '-10.5%',  net: '238.8',  neg: false, ref: '2025-01-094740' },
];

const $ = id => document.getElementById(id);
const rowsEl = $('rows');
ROWS.forEach((r, i) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="co">${r.co}</td><td class="time">${r.time}</td>` +
    `<td class="num">${r.rev}</td><td class="num">${r.yoy}</td>` +
    `<td class="num ${r.neg ? 'neg' : ''}">${r.net}</td>` +
    `<td><span class="ref"><span class="n">${i + 1}</span>${r.ref}</span></td>`;
  rowsEl.appendChild(tr);
});
const rowEls = [...rowsEl.children];

// One span per character so each can ease in (opacity + blur) instead of popping on like a stencil.
const chars = [...QUERY].map(c => {
  const s = document.createElement('span');
  s.textContent = c;
  $('text').appendChild(s);
  return s;
});
const caret = document.createElement('span');
caret.className = 'caret';
$('text').appendChild(caret);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const ramp = (t, a, b, f = ease) => f((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;

// Timeline (seconds) — keep in sync with timeline.py (CHAT_*)
const T = {
  whiteout: [0.0, 1.0],
  zoomIn: [0.0, 1.1],
  type: [0.9, 2.9], charFade: 0.22,
  press: 3.1,
  lift: [3.25, 3.95],
  table: 5.1,
};
window.TIMELINE = T;

// Final bubble geometry: right-aligned with the answer card, hugging the text at its final size.
// Measured at render time so it uses the loaded web font.
function bubble() {
  const m = document.createElement('span');
  m.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:400 32px Heebo';
  m.textContent = QUERY;
  document.body.appendChild(m);
  const w = m.getBoundingClientRect().width;
  m.remove();
  return { right: 180, width: Math.ceil(w) + 34 * 2 + 4 };
}

window.render = function (t) {
  document.scrollingElement.scrollLeft = 0;
  document.scrollingElement.scrollTop = 0;
  $('whiteout').style.opacity = 1 - ramp(t, ...T.whiteout);

  // Camera: eases in from wide, a small punch on the press, then a slow push toward the table with the tilt settling
  const zin = ramp(t, ...T.zoomIn);
  const punch = t >= T.press ? Math.exp(-(t - T.press) * 7) * Math.sin(Math.min(Math.PI, (t - T.press) * 12)) * 0.025 : 0;
  const drift = 0.06 * clamp((t - 1.0) / 7);
  const scale = lerp(0.82, 1.0, zin) + drift + punch;
  const tilt = lerp(9, 3, zin) - 2.5 * ramp(t, T.table, 8);
  $('cam').style.transform = `perspective(1800px) rotateX(${tilt}deg) scale(${scale})`;

  // Typing: characters ease in, a few at a time
  const span = T.type[1] - T.type[0];
  chars.forEach((c, i) => {
    const start = T.type[0] + span * i / chars.length;
    const u = ramp(t, start, start + T.charFade, easeOut);
    c.style.opacity = u;
    c.style.filter = `blur(${(1 - u) * 6}px)`;
    c.style.color = u < 1 ? `rgb(${lerp(45, 28, u)}, ${lerp(106, 27, u)}, ${lerp(106, 25, u)})` : '';
  });
  const shown = chars.findIndex(c => parseFloat(c.style.opacity) <= 0);
  $('text').insertBefore(caret, shown === -1 ? null : chars[shown]);
  caret.style.opacity = t < T.press ? (t > T.type[0] && t < T.type[1] ? 1 : 0.5 + 0.5 * Math.cos(t * 7)) : 0;

  // Send: press, ring blooms outward
  const p = t >= T.press && t < T.press + 0.16 ? 0.86 : 1;
  $('send').style.transform = `scale(${p})`;
  const r = clamp((t - T.press) / 0.4);
  $('ring').style.opacity = t >= T.press ? (1 - r) * 0.8 : 0;
  $('ring').style.transform = `scale(${1 + r * 2.2})`;

  // After sending, the input becomes the user's message bubble: pinned right, the interface's bubble colour, flat
  const l = ramp(t, ...T.lift);
  const BUBBLE = bubble();
  const comp = $('composer');
  comp.style.top = lerp(470, 108, l) + 'px';
  comp.style.right = lerp(240, BUBBLE.right, l) + 'px';
  comp.style.width = lerp(1440, BUBBLE.width, l) + 'px';
  comp.style.minHeight = lerp(140, 0, l) + 'px';
  comp.style.padding = `${lerp(40, 20, l)}px ${lerp(56, 34, l)}px ${lerp(40, 20, l)}px ${lerp(140, 34, l)}px`;
  comp.style.borderRadius = `${lerp(30, 24, l)}px ${lerp(30, 6, l)}px ${lerp(30, 24, l)}px ${lerp(30, 24, l)}px`;
  comp.style.background = `rgb(${lerp(255, 229, l)}, ${lerp(255, 239, l)}, ${lerp(255, 239, l)})`;
  comp.style.borderColor = `rgba(28, 27, 25, ${0.1 * (1 - l)})`;
  comp.style.boxShadow = `0 40px 90px rgba(28,27,25,${0.14 * (1 - l)}), 0 8px 24px rgba(28,27,25,${0.07 * (1 - l)})`;
  $('text').style.fontSize = lerp(46, 32, l) + 'px';
  $('send').style.opacity = 1 - clamp(l * 3);

  // The answer rises in as one block, rows settling just behind it
  const a = ramp(t, T.table, T.table + 0.6, easeOut);
  $('answer').style.opacity = a;
  $('answer').style.transform = `translateY(${(1 - a) * 60}px) scale(${lerp(0.96, 1, a)})`;
  rowEls.forEach((el, i) => {
    const o = ramp(t, T.table + 0.1 + i * 0.07, T.table + 0.5 + i * 0.07, easeOut);
    el.style.opacity = o;
  });
};
window.render(0);
</script>
</body>
</html>
