<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
<script src="../vendor/three.min.js"></script>
</head>
<body>
<script>
// A real Magna report page, lit and bending, tumbling up and out of the frame.
const DURATION = 2.0;
const PW = 1.3, PH = 1.84; // A4 proportions, world units

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);
camera.position.set(0, 0, 10);

scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const key = new THREE.DirectionalLight(0xfff3e2, 2.6);
key.position.set(3, 5, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fc4d6, 0.45);
fill.position.set(-4, -2, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.9);
rim.position.set(0, 3, -6);
scene.add(rim);

const loader = new THREE.TextureLoader();
function tex(url) {
  const t = loader.load(url, () => { window.__loaded = (window.__loaded || 0) + 1; });
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const geo = new THREE.PlaneGeometry(PW, PH, 36, 50);
const base = geo.attributes.position.array.slice();
const front = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex('../assets/page-front.jpg'), roughness: 0.88, metalness: 0, side: THREE.FrontSide }));
const back = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex('../assets/page-back.jpg'), roughness: 0.9, metalness: 0, side: THREE.BackSide }));
const page = new THREE.Group();
page.add(front, back);
scene.add(page);

function deform(t) {
  const p = geo.attributes.position.array;
  const bend = 0.32 * Math.sin(t * 5.2 + 0.4) + 0.08;         // cylindrical bend across the width
  const lift = 0.10 * Math.sin(t * 3.1 + 1.1);                 // the sheet's long axis sags and lifts
  for (let i = 0; i < p.length; i += 3) {
    const x = base[i] / (PW / 2), y = base[i + 1] / (PH / 2);  // -1..1
    const wave = 0.05 * Math.sin(4.2 * y - 17 * t) * (x + 1) * 0.5;      // ripple travelling along the sheet
    const corner = 0.07 * Math.max(0, x * y) * Math.sin(23 * t + 2);    // a loose corner flapping
    p[i + 2] = bend * x * x * (PW / 2) + lift * y * y * (PH / 2) + wave + corner;
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
}

window.render = function (t) {
  const u = Math.min(1, Math.max(0, t / DURATION));
  page.position.set(
    5.7 - 11.9 * u + 0.35 * Math.sin(9 * u),
    -3.7 + 7.6 * Math.pow(u, 1.12) + 0.25 * Math.sin(13 * u),
    1.0 - 1.6 * u + 0.3 * Math.sin(5 * u),
  );
  page.rotation.set(0.65 + 0.9 * Math.sin(6 * u + 0.3), 1.1 * Math.sin(4.5 * u + 1.0), -0.4 + 3.3 * u);
  deform(t);
  renderer.render(scene, camera);
};
window.ready = () => (window.__loaded || 0) >= 2;
window.render(0);
</script>
</body>
</html>
