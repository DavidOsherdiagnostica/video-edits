<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/local.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .layer { position: absolute; inset: 0; display: none; }

  /* Title cards */
  .card { align-items: center; justify-content: center; }
  .card p {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 900; font-size: 104px; color: #f4f1ea;
    letter-spacing: 0.01em; text-align: center;
    text-shadow: 0 0 28px rgba(0,0,0,0.85), 0 0 60px rgba(0,0,0,0.6), 0 0 18px rgba(170, 220, 210, 0.18);
  }
  .card.low { align-items: flex-end; padding-bottom: 175px;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 72%, rgba(0,0,0,0.8) 100%); }
  .card.low p { font-size: 88px; }

  /* Fluttering page */
  #paper { position: absolute; width: 230px; height: 300px; left: 0; top: 0; perspective: 900px; }
  #sheet {
    width: 100%; height: 100%; background: #f2efe8; border-radius: 3px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    padding: 34px 26px; transform-style: preserve-3d;
    background-image: linear-gradient(160deg, rgba(255,255,255,0.0) 40%, rgba(0,0,0,0.10));
  }
  #sheet i { display: block; height: 7px; background: #c9c4ba; margin-bottom: 15px; border-radius: 2px; }

  /* Logo */
  #logo { align-items: center; justify-content: center; }
  #logo img { width: 640px; }
</style>
</head>
<body>
<div class="layer card" id="c1"><p>עונת הדוחות מתקרבת.</p></div>
<div class="layer card low" id="c2"><p>הם מגיעים בכמויות.</p></div>
<div class="layer card low" id="c3"><p>והשעון לא עוצר.</p></div>
<div class="layer card" id="c5"><p>הפעם, אתם מוכנים.</p></div>
<div class="layer" id="flutter">
  <div id="paper"><div id="sheet">
    <i style="width:70%"></i><i></i><i style="width:88%"></i><i></i><i style="width:60%"></i>
    <i></i><i style="width:92%"></i><i style="width:75%"></i><i></i><i style="width:40%"></i>
  </div></div>
</div>
<div class="layer" id="logo"><img src="../../raw materials/hon_full_logo_5X1_for_dark_mode.svg"></div>
<script>
const which = new URLSearchParams(location.search).get('l');
document.getElementById(which).style.display = 'flex';

// The page drifts in from the lower-right, tumbles, and leaves through the top-left edge.
window.render = function (t) {
  if (which !== 'flutter') return;
  const D = 1.8, u = Math.min(1, t / D);
  const x = 1500 - 1900 * u + 60 * Math.sin(u * 9);
  const y = 820 - 1150 * u * u + 40 * Math.sin(u * 13);
  const rz = -20 + 260 * u, rx = 55 * Math.sin(u * 11), ry = 70 * Math.sin(u * 7 + 1);
  document.getElementById('paper').style.transform = `translate(${x}px, ${y}px)`;
  document.getElementById('sheet').style.transform = `rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
};
window.render(0);
</script>
</body>
</html>
